# Выпуск Darwaza через GitLab CI.
#
# Что делает пайплайн по метке vX.Y.Z:
#   1. сверяет версию в четырёх файлах и метке — расхождение ловится ДО сборки;
#   2. прогоняет тесты и сборку интерфейса;
#   3. собирает .deb, .rpm и AppImage;
#   4. считает контрольные суммы и делает releases.json для витрины;
#   5. кладёт файлы в реестр пакетов проекта;
#   6. создаёт релиз с описанием из CHANGELOG.md, CHANGELOG_ru.md и CHANGELOG_uz.md.
#
# Почему описание берётся из файла, а не пишется в пайплайне: написанное в двух
# местах расходится молча. Три файла журнала — единственный источник.
#
# Живые тесты синхронизации (`#[ignore]`) и e2e рабочего стола здесь НЕ идут:
# первым нужен настоящий сервер, вторым — запущенное окно приложения. Молчать
# об этом нельзя, поэтому написано прямо здесь: зелёный пайплайн не заменяет
# проверку установки на чистой системе (docs/07-release/production-plan.md, Э6).

stages:
  - checks
  - build
  - assemble
  - publish
  - release

variables:
  # Кэши кладём внутрь рабочего каталога: снаружи GitLab их не сохранит.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  PNPM_HOME: $CI_PROJECT_DIR/.pnpm
  # Сборка в контейнере без FUSE: без этого AppImage не собирается.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # `strip` внутри linuxdeploy старше библиотек современных дистрибутивов и не
  # понимает секцию `.relr.dyn`, которую делает нынешний компоновщик. Он падает
  # на каждой такой библиотеке, и сборка AppImage обрывается с невнятным
  # «failed to run linuxdeploy». Пропуск strip лечит это целиком; цена —
  # несколько лишних мегабайт в образе.
  NO_STRIP: "1"
  GIT_DEPTH: "50"

workflow:
  rules:
    # Метка выпуска — единственное, что запускает сборку и публикацию.
    # `vX.Y.Z-rcN` — предварительная версия: те же сборки, на GitHub она
    # выходит как prerelease, а файлы для сайта и обновления никуда сами не
    # попадают (их кладут на сервер руками, см. ci.md). Версия в файлах — X.Y.Z.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Всё прочее пайплайна не заводит: двойные прогоны на ветку и на MR — шум.

default:
  interruptible: true

# Общий образ для всего, что трогает Rust и Tauri. Зависимости ставятся
# каждый раз: свой образ в реестре быстрее, но это отдельная задача, а
# лишний шаг в начале честнее, чем образ, о котором никто не помнит.
.linux-toolchain:
  image: rust:1.95-bookworm
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      libxdo-dev libssl-dev build-essential file wget curl ca-certificates
      gnupg python3
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    # Версия pnpm объявлена в package.json (packageManager) — здесь её нет
    # намеренно: два места означают расхождение.
    - corepack enable
    - export PATH="$PNPM_HOME:$PATH"
    - pnpm install --frozen-lockfile
  cache:
    # Ключ по замкам: меняются зависимости — меняется кэш, и старый не мешает.
    key:
      files:
        - pnpm-lock.yaml
        - src-tauri/Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .pnpm/store
    # src-tauri/target намеренно НЕ кэшируется: тесты собираются профилем
    # debug, релиз — профилем release, и один другому не помогает. Гонять
    # ради этого гигабайты в обе стороны дороже, чем пересобрать.

# ---------------------------------------------------------------- проверки

versions:
  stage: checks
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3
  script:
    # На метке сверяем ещё и с ней: v0.2.0 на коде 0.1.9 — обычная ошибка
    # спешки, и стоит она выпущенного пакета с чужим номером.
    - ./scripts/check-versions.sh ${CI_COMMIT_TAG:-}
    # Сборка описания релиза из трёх языков не должна молча терять язык.
    - ./scripts/test-release-notes.sh

test:desktop:
  extends: .linux-toolchain
  stage: checks
  script:
    - pnpm lint
    # vue-tsc внутри build: типы проверяются ровно тем, чем собирается.
    - pnpm build
    - cd src-tauri && cargo test --locked --workspace

# ------------------------------------------------------------------ сборка

build:linux:
  extends: .linux-toolchain
  stage: build
  needs: [versions, test:desktop]
  rules:
    - if: $CI_COMMIT_TAG
  timeout: 1h 30m
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    # Куда файлы лягут ВНУТРИ GitLab — это хранилище пайплайна.
    - export PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/darwaza/$VERSION"
    # А откуда их будут скачивать ЛЮДИ — это другое место, и по умолчанию
    # оно не совпадает. Репозиторий закрытый, значит и реестр закрыт: ссылка
    # на него потребует входа, и посторонний по ней не скачает ничего.
    # DOWNLOAD_BASE_URL задаётся переменной проекта (Settings → CI/CD →
    # Variables) и указывает на публичную витрину выпусков, например
    #   https://github.com/ВЛАДЕЛЕЦ/darwaza/releases/download/$CI_COMMIT_TAG
    # Ссылки верны с той минуты, как файлы там окажутся, — неважно, положил
    # их пайплайн, выкладка или человек руками.
    - export PUBLIC_BASE="${DOWNLOAD_BASE_URL:-$PKG_BASE}"
    - |
      if [ -z "${DOWNLOAD_BASE_URL:-}" ]; then
        echo "ВНИМАНИЕ: DOWNLOAD_BASE_URL не задана."
        echo "releases.json будет указывать на закрытый реестр GitLab —"
        echo "по этим ссылкам посторонний скачать НЕ сможет."
      fi
    # Подпись обновлений (#164). Без ключа сборка проходит, но обновиться по
    # ней будет нельзя: приложение проверяет подпись и подменённый файл
    # отвергает. Ключ задаётся переменной проекта TAURI_SIGNING_PRIVATE_KEY;
    # молчать о его отсутствии нельзя — иначе выпуск выйдет без обновлений, и
    # выяснится это у людей.
    - |
      if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
        echo "ВНИМАНИЕ: TAURI_SIGNING_PRIVATE_KEY не задан."
        echo "Сборка не будет подписана, и авто-обновление на неё не сработает."
      fi
    - pnpm tauri build
    - ./scripts/release-manifest.sh "$VERSION" "$PUBLIC_BASE" dist-release
    # Проверка releases.json схемой контракта живёт в репозитории server —
    # там, где сама схема и эндпоинт, который этот файл читает. Тащить схему
    # сюда значило бы завести её копию, а копия расходится молча. Проверка
    # делается на стороне сервера перед тем, как файл начнёт отдаваться
    # витриной (docs/07-release/ci.md).
    # Заметки берутся из раздела CHANGELOG без «-rcN»: проба 0.1.1-rc2 — это 0.1.1.
    - ./scripts/release-notes.sh "${VERSION%-rc*}" > dist-release/release-notes.md
    # Имена файлов заранее не известны — их подставляет сборщик. Передаём
    # готовые ссылки следующим шагам, чтобы те не гадали.
    - |
      {
        echo "VERSION=$VERSION"
        echo "PKG_BASE=$PKG_BASE"
        echo "PUBLIC_BASE=$PUBLIC_BASE"
        echo "DEB_URL=$(python3 -c "import json;print([a['url'] for a in json.load(open('dist-release/releases.json'))['assets'] if a['kind']=='deb'][0])")"
        echo "RPM_URL=$(python3 -c "import json;print([a['url'] for a in json.load(open('dist-release/releases.json'))['assets'] if a['kind']=='rpm'][0])")"
        echo "APPIMAGE_URL=$(python3 -c "import json;print([a['url'] for a in json.load(open('dist-release/releases.json'))['assets'] if a['kind']=='AppImage'][0])")"
        echo "SUMS_URL=$PUBLIC_BASE/SHA256SUMS"
        echo "MANIFEST_URL=$PUBLIC_BASE/releases.json"
      } > release.env
  artifacts:
    name: "darwaza-$CI_COMMIT_TAG"
    paths:
      - dist-release/
      # Подписи обновлений нужны шагу assemble:release (latest.json).
      - src-tauri/target/release/bundle/**/*.sig
    reports:
      dotenv: release.env
    expire_in: never

# ------------------------------------------------------- Windows и macOS

# Обе системы собираются ТОЛЬКО на своих машинах. Кросс-сборка из Linux не
# годится в принципе: Tauri берёт системный вебвью — WebView2 на Windows и
# WKWebView на macOS, — а его нет в кросс-окружении. Поэтому здесь нужны
# отдельные раннеры.
#
# Раннеры GitLab SaaS для Windows и macOS ПЛАТНЫЕ и включаются владельцем в
# настройках проекта. Пока они не включены, оба задания просто не запустятся,
# и Linux-выпуск от этого не пострадает — `allow_failure` ниже ровно об этом.
#
# Пока раннеров нет, собрать можно руками на своей машине той же командой
# `pnpm tauri build`; файлы кладутся в тот же bundle, и общий манифест их
# подхватит (scripts/release-manifest.sh).

build:windows:
  stage: build
  needs: [versions, test:desktop]
  rules:
    - if: $CI_COMMIT_TAG
  # Задание не должно валить выпуск: Linux — целевая система, Windows пока нет.
  allow_failure: true
  timeout: 1h 30m
  tags:
    - saas-windows-medium-amd64
  variables:
    # MSVC, а не GNU: WebView2 и подписывание работают только с ним.
    RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    # Явные каталоги Rust. Через chocolatey (rustup.install) rustup ложился
    # неизвестно куда: в профиль другого пользователя, и `rustup` не находился
    # даже после дописывания $USERPROFILE\.cargo\bin в PATH (rc1, 2026-11-05).
    RUSTUP_HOME: C:\rust\rustup
    CARGO_HOME: C:\rust\cargo
  before_script:
    - Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
    - .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain $env:RUSTUP_TOOLCHAIN
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - rustc --version
    - |
      # На образе раннера Node 21, а pnpm 11 на нём падает при запуске
      # (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING, rc2). Ставим свой Node 22 LTS.
      Invoke-WebRequest -Uri https://nodejs.org/dist/v22.23.4/node-v22.23.4-win-x64.zip -OutFile node.zip
      Expand-Archive node.zip -DestinationPath C:\node
      $env:Path = "C:\node\node-v22.23.4-win-x64;$env:Path"
    - node --version
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    # Даёт .msi и установщик NSIS (.exe). Оба идут на витрину: msi ставится
    # политиками в организациях, exe привычнее человеку.
    #
    # При `createUpdaterArtifacts: true` сборка без ключа подписи обновлений
    # падает уже ПОСЛЕ установщиков, с кодом 1. Ключ в CI берётся из переменной
    # проекта; если её нет — собираем без артефактов обновления отдельным
    # файлом настроек (без копирования ключа на машину и без правки основной
    # конфигурации). То же для локальной сборки на Windows:
    #   pnpm tauri build --config src-tauri/tauri.no-updater.conf.json
    - |
      if ($env:TAURI_SIGNING_PRIVATE_KEY) {
        pnpm tauri build
      } else {
        Write-Host "ВНИМАНИЕ: TAURI_SIGNING_PRIVATE_KEY не задан — собираю без артефактов обновления."
        pnpm tauri build --config src-tauri/tauri.no-updater.conf.json
      }
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    name: "darwaza-windows-$CI_COMMIT_TAG"
    paths:
      - src-tauri/target/release/bundle/msi/
      - src-tauri/target/release/bundle/nsis/
    expire_in: never

build:macos:
  stage: build
  needs: [versions, test:desktop]
  rules:
    - if: $CI_COMMIT_TAG
  allow_failure: true
  timeout: 1h 30m
  tags:
    - saas-macos-medium-m1
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    # Сборка под оба процессора: Apple Silicon и Intel. Одного мало —
    # на чужой машине приложение просто не запустится.
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - pnpm tauri build --target universal-apple-darwin
  artifacts:
    name: "darwaza-macos-$CI_COMMIT_TAG"
    paths:
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/
    expire_in: never
  # ВНИМАНИЕ: сборка НЕ подписана. macOS покажет «программу нельзя открыть,
  # так как её автор не установлен», и обойти это человек сможет только через
  # системные настройки. Подпись требует платного Apple Developer ID и
  # заверения у Apple; переменные APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
  # APPLE_ID и APPLE_PASSWORD задаются владельцем в настройках проекта, и
  # Tauri подхватывает их сам. Молчать об этом нельзя: неподписанная сборка
  # выглядит для человека как сломанная.

# Сборка выпуска из всех систем в один каталог. Linux и Windows собираются
# разными заданиями на разных машинах, и без этого шага Windows-установщик
# оставался бы артефактом своего задания: ни на GitHub, ни в releases.json,
# ни в контрольных суммах его не было бы.
assemble:release:
  stage: assemble
  image: debian:bookworm-slim
  needs:
    - job: build:linux
      artifacts: true
    # Windows-раннер платный и может быть выключен; тогда выпуск выходит без
    # Windows, но об этом сказано громко (см. скрипт).
    - job: build:windows
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 coreutils findutils
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - export PUBLIC_BASE="${DOWNLOAD_BASE_URL:-$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/darwaza/$VERSION}"
    # Плоский каталог со всеми пакетами и подписями обновлений. Linux-файлы
    # берём из готового dist-release (подписи .sig там нет, поэтому
    # собираем их из bundle ниже, если он есть).
    - mkdir -p merged
    - find dist-release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} merged/ \;
    - |
      if [ -d src-tauri/target/release/bundle ]; then
        find src-tauri/target/release/bundle -type f \( -name '*.sig' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} merged/ \;
      fi
    - |
      if ! ls merged/*-setup.exe >/dev/null 2>&1; then
        echo "################################################################"
        echo "ВНИМАНИЕ: Windows-установщика нет — build:windows не дал результата."
        echo "Выпуск выйдет только для Linux. Проверьте задание build:windows."
        echo "################################################################"
      fi
    - BUNDLE_DIR=merged ./scripts/release-manifest.sh "$VERSION" "$PUBLIC_BASE" dist-final
    - ./scripts/release-notes.sh "${VERSION%-rc*}" > dist-final/release-notes.md
  artifacts:
    name: "darwaza-final-$CI_COMMIT_TAG"
    paths:
      - dist-final/
    expire_in: never

# --------------------------------------------------------------- публикация

publish:packages:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: build:linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Реестр пакетов, а не «просто артефакты задания»: у артефактов есть срок
    # и путь через веб-интерфейс, а ссылку в релизе мы даём людям надолго.
    - |
      for file in dist-release/*; do
        name=$(basename "$file")
        echo "Загружаю $name"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$file" \
          "$PKG_BASE/$name"
        echo
      done

# Публичная витрина: GitHub Releases (#166).
#
# Репозиторий кода в GitLab закрытый, значит и реестр пакетов закрыт: ссылка на
# него потребует входа, и посторонний по ней не скачает ничего. Поэтому файлы
# дублируются в публичный репозиторий на GitHub — там они и лежат для людей, и
# оттуда же берёт их витрина по DOWNLOAD_BASE_URL.
#
# Нужны две переменные проекта (Settings → CI/CD → Variables):
#   GITHUB_TOKEN — токен с правом `contents: write` в публичном репозитории,
#                  «Masked» и «Protected»;
#   GITHUB_REPO  — «владелец/репозиторий», например `ikhasanmusaev/darwaza`.
#
# Без них задание не падает, а сообщает и пропускается: Linux-выпуск не должен
# срываться из-за витрины, но и молчать об этом нельзя — иначе ссылки в
# releases.json окажутся ведущими в никуда, и узнают об этом посетители.
publish:github:
  stage: publish
  image: alpine:latest
  needs:
    - job: assemble:release
      artifacts: true
  # Пробные метки vX.Y.Z-rcN на витрину не идут: их проверяет владелец, файлы
  # берутся из артефактов assemble:release. Иначе GitHub создал бы метку сам —
  # на том коммите, что там окажется, а не на нашем.
  rules:
    - if: $CI_COMMIT_TAG =~ /-rc[0-9]+$/
      when: never
    - if: $CI_COMMIT_TAG
  allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ] || [ -z "${GITHUB_REPO:-}" ]; then
        echo "GITHUB_TOKEN или GITHUB_REPO не заданы — выкладка на витрину пропущена."
        echo "Файлы останутся только в закрытом реестре GitLab, и ссылки в"
        echo "releases.json будут требовать входа. Задайте переменные проекта."
        exit 0
      fi
    - |
      api="https://api.github.com/repos/$GITHUB_REPO"
      auth="Authorization: Bearer $GITHUB_TOKEN"

      # Релиз может уже существовать — например, если задание перезапустили.
      # Тогда переиспользуем его, а не плодим второй с тем же именем.
      id=$(curl --silent --header "$auth" "$api/releases/tags/$CI_COMMIT_TAG" | jq -r '.id // empty')
      if [ -z "$id" ]; then
        id=$(curl --fail-with-body --silent --show-error --request POST \
          --header "$auth" --header "Content-Type: application/json" \
          --data "$(jq -n --arg tag "$CI_COMMIT_TAG" \
                      --rawfile body dist-final/release-notes.md \
                      '{tag_name: $tag, name: $tag, body: $body,
                       prerelease: ($tag | test("-rc[0-9]+$"))}')" \
          "$api/releases" | jq -r '.id')
      fi
      [ -n "$id" ] || { echo "не удалось создать релиз на GitHub" >&2; exit 1; }

      for file in dist-final/*; do
        name=$(basename "$file")
        echo "Выкладываю $name"
        # Существующий файл с тем же именем удаляем: GitHub не заменяет их
        # молча, а отвечает отказом, и повтор задания срывался бы на первом же.
        old=$(curl --silent --header "$auth" "$api/releases/$id/assets" \
              | jq -r --arg n "$name" '.[] | select(.name == $n) | .id')
        [ -n "$old" ] && curl --silent --request DELETE --header "$auth" "$api/releases/assets/$old"

        curl --fail-with-body --silent --show-error --request POST \
          --header "$auth" --header "Content-Type: application/octet-stream" \
          --data-binary "@$file" \
          "https://uploads.github.com/repos/$GITHUB_REPO/releases/$id/assets?name=$name" > /dev/null
      done
      echo "Выложено на https://github.com/$GITHUB_REPO/releases/tag/$CI_COMMIT_TAG"

# ------------------------------------------------------------------- релиз

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux
      artifacts: true
    - job: publish:packages
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Релиз Darwaza $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Darwaza $VERSION"
    description: dist-release/release-notes.md
    assets:
      links:
        - name: "Debian, Ubuntu, Mint — .deb"
          url: $DEB_URL
          link_type: package
        - name: "Fedora, RHEL, openSUSE — .rpm"
          url: $RPM_URL
          link_type: package
        - name: "Любой дистрибутив — AppImage"
          url: $APPIMAGE_URL
          link_type: package
        - name: "Контрольные суммы — SHA256SUMS"
          url: $SUMS_URL
          link_type: other
        - name: "Список сборок для витрины — releases.json"
          url: $MANIFEST_URL
          link_type: other
